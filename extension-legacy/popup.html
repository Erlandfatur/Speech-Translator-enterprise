<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Translator Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="st-popup-body">
  <div class="st-popup-header">
    <div class="st-popup-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <div>
      <h3 style="margin:0; font-size:14px; font-weight:600; letter-spacing:-0.02em;">Translator</h3>
      <span style="font-size:11px; color:#888;">Real-time AI Overlay</span>
    </div>
  </div>

  <div class="st-form-group">
    <label class="st-label" for="capture-mode">Mode Perekaman</label>
    <select id="capture-mode" class="st-select">
      <option value="both">Keduanya (Mic & Tab)</option>
      <option value="mic">Hanya Mikrofon</option>
      <option value="tab">Hanya Audio Tab</option>
    </select>
  </div>

  <div class="st-form-group">
    <label class="st-label" for="spoken-lang">Bahasa Asal</label>
    <select id="spoken-lang" class="st-select">
      <option value="auto">Otodetek (Auto)</option>
      <option value="en">English</option>
      <option value="id">Indonesia</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh">Chinese</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ar">Arabic</option>
      <option value="ru">Russian</option>
    </select>
  </div>

  <div class="st-form-group">
    <label class="st-label" for="target-lang">Bahasa Tujuan</label>
    <select id="target-lang" class="st-select">
      <option value="id">Indonesia</option>
      <option value="en">English</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="zh">Chinese</option>
      <option value="es">Spanish</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="ar">Arabic</option>
      <option value="ru">Russian</option>
    </select>
  </div>

  <div class="st-form-group">
    <label class="st-label" for="audio-output-select">Perangkat Output</label>
    <select id="audio-output-select" class="st-select">
      <option value="default">Default Speaker</option>
    </select>
  </div>

  <div class="st-toggle-row">
    <span class="st-label" style="margin:0;">Audio TTS & Ducking</span>
    <input type="checkbox" id="tts-toggle" checked style="accent-color: #FFFFFF;">
  </div>

  <div class="st-toggle-row">
    <span class="st-label" style="margin:0;" title="Kirim suara AI ke Mikrofon Virtual">Virtual Mic Output</span>
    <input type="checkbox" id="virtual-mic-toggle" style="accent-color: #FFFFFF;">
  </div>

  <details style="margin-top:12px; font-size:12px; color:#888;">
    <summary style="cursor:pointer; color:#AAA; font-weight:500; padding:4px 0; letter-spacing:0.02em;">Custom API Keys</summary>
    <div style="margin-top:12px; display:flex; flex-direction:column; gap:12px;">
      <div>
        <label class="st-label" for="groq-api-key" style="font-size:10px;">Groq API Key</label>
        <input type="password" id="groq-api-key" class="st-input" placeholder="***REMOVED***... (kosongkan jika bawaan)">
      </div>
      <div>
        <label class="st-label" for="gemini-api-key" style="font-size:10px;">Gemini API Key</label>
        <input type="password" id="gemini-api-key" class="st-input" placeholder="***REMOVED***... (opsional)">
      </div>
    </div>
  </details>

  <div style="margin-top:24px;">
    <button id="toggle-btn" class="st-btn st-btn-primary">Start Translation</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
