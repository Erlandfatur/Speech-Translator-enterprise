<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Microphone Access Required</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #E5E5E5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: #0A0A0A; 
            padding: 48px 40px; 
            border-radius: 8px; 
            text-align: center; 
            max-width: 420px; 
            border: 1px solid #1F1F1F; 
        }
        h1 { 
            color: #FFFFFF; 
            margin-top: 0; 
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }
        p { 
            line-height: 1.6; 
            color: #A3A3A3; 
            margin-bottom: 32px; 
            font-size: 14px;
        }
        button { 
            background-color: #FFFFFF; 
            color: #000000; 
            border: 1px solid #FFFFFF; 
            padding: 10px 24px; 
            border-radius: 4px; 
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s ease; 
        }
        button:hover { 
            background-color: #000000; 
            color: #FFFFFF;
        }
        #status { 
            margin-top: 24px; 
            font-size: 13px;
            font-weight: 500; 
        }
        .success { color: #FFFFFF; }
        .error { color: #888888; }
    </style>
</head>
<body>
    <div class="container">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 16px; color: #fff;">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
        <h1>Microphone Access</h1>
        <p>Speech Translator requires microphone access to capture your voice for real-time translation.<br><br>Please click the button below and select <strong>Allow</strong> in the browser prompt.</p>
        <button id="request-btn">Grant Access</button>
        <div id="status"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
