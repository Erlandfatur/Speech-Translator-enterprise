app = "speech-translator"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://erlandfatur.github.io,http://localhost:5173"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.health_checks]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    path = "/health"

[[mounts]]
  source = "speech_models"
  destination = "/app/models"
